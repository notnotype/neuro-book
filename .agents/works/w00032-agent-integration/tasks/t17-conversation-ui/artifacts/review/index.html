<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t17 对话界面第一版：静态稿</title>
<style>
:root { --bg:#f7f6f2; --panel:#fff; --text:#1f2328; --muted:#6b6f76; --line:#e3e1da; --accent:#0a66d8; --warn:#b45309; --warn-bg:#fff4e0; --code:#f2f1ec; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1c1f; --panel:#24262a; --text:#e6e6e6; --muted:#9a9ca1; --line:#34363b; --accent:#5aa2ff; --warn:#f0b35a; --warn-bg:#3a2c16; --code:#2c2e33; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.7 system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif; }
main { max-width:1180px; margin:0 auto; padding:32px 16px 80px; }
h1 { font-size:26px; margin:0 0 4px; }
h2 { font-size:20px; margin:40px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
p,li { max-width:880px; }
.badge { font-size:12px; padding:1px 8px; border-radius:4px; background:var(--warn-bg); color:var(--warn); margin-right:8px; vertical-align:2px; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); margin:12px 0; }
.wide { grid-template-columns:repeat(auto-fill,minmax(540px,1fr)); }
figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
figure img { display:block; width:100%; height:auto; }
figcaption { padding:8px 12px; font-size:13px; color:var(--muted); }
.rec { border-left:3px solid var(--accent); padding:4px 0 4px 12px; }
code { font-family:ui-monospace,monospace; font-size:13px; background:var(--code); padding:1px 5px; border-radius:4px; }
.bar { display:flex; justify-content:flex-end; gap:12px; background:var(--code); border:1px solid var(--line); border-radius:6px; padding:3px 12px; font-size:12px; color:var(--muted); }
.bar b { color:var(--accent); font-weight:500; }
.cand { border-top:1px dashed var(--line); padding-top:8px; margin-top:12px; }
.strip { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
.strip img { display:block; width:100%; border:1px solid var(--line); border-radius:6px; }
table { border-collapse:collapse; width:100%; font-size:14px; background:var(--panel); } th,td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
</style>
</head>
<body>
<main>
<h1>t17 对话界面第一版：第 1 片，圆角与对齐（第 7 轮）</h1>
<section data-nbdev-question="s1-radius" data-nbdev-type="single" data-nbdev-recommend="ok" data-nbdev-options="ok:可以|change:要改（写在备注里）">
<h2><span class="badge" data-nbdev-skip>待定</span>全局圆角落到真实界面</h2>
<p>这是 nbook 主题的实际代码，不是草稿：控件与按钮 6，气泡、输入框、面板 10，菜单 8，对话框 12。nb-story 和 nbdev 面板用同一个主题，一起变了。对话里的左右边距都是 12，滚动条改成浮在内容上，不再占宽度，所以右边和左边对齐了。</p>
<p>别的主题（aurora、editorial、macos）只有气泡跟着各自的面板圆角走，按钮和菜单不变，这几张没放进来。推荐：可以。</p>
<div class="grid">
<figure><a href="r7/conversation.webp"><img src="r7/conversation.webp" alt="对话（运行中）" loading="lazy"></a><figcaption>对话（运行中）</figcaption></figure>
<figure><a href="r7/answer.webp"><img src="r7/answer.webp" alt="对话（结构化答案）" loading="lazy"></a><figcaption>对话（等回答）</figcaption></figure>
<figure><a href="r7/menu4x.webp"><img src="r7/menu4x.webp" alt="菜单放大 4 倍：外圈 8，内圈 3" loading="lazy"></a><figcaption>菜单放大 4 倍：外圈 8，内圈 3</figcaption></figure>
</div>
<div class="grid wide">
<figure><a href="r7/shelf.webp"><img src="r7/shelf.webp" alt="书架" loading="lazy"></a><figcaption>书架</figcaption></figure>
<figure><a href="r7/settings.webp"><img src="r7/settings.webp" alt="设置" loading="lazy"></a><figcaption>设置</figcaption></figure>
<figure><a href="r7/dialog.webp"><img src="r7/dialog.webp" alt="对话框" loading="lazy"></a><figcaption>对话框</figcaption></figure>
<figure><a href="r7/shell.webp"><img src="r7/shell.webp" alt="工作台外壳（Lab 场景，没开真实编辑器）" loading="lazy"></a><figcaption>工作台外壳（Lab 场景，没开真实编辑器）</figcaption></figure>
<figure><a href="r7/story-qa.webp"><img src="r7/story-qa.webp" alt="nb-story 问答" loading="lazy"></a><figcaption>nb-story 问答</figcaption></figure>
<figure><a href="r7/panel.webp"><img src="r7/panel.webp" alt="nbdev 面板（临时仓库的数据）" loading="lazy"></a><figcaption>nbdev 面板（临时仓库的数据）</figcaption></figure>
</div>
</section>
</main>
</body>
</html>
