# 给已经发布的版本补 macOS 桌面包（w00046 t23、t24）：输入版本标签与那次 Release 流水线的运行编号，用
# desktop-macos-build.yml 构建，再把资产补传到同一个 Release（只补缺的，同名而内容不同就失败）。发布流水线自己会构建 macOS 版，
# 这个工作流只在那一轮的 macOS 构建失败、或给 t24 之前的版本补包时用。
name: Desktop macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签，例如 v0.14.0（Release 要已经存在）"
        required: true
      release-run:
        description: "那个标签的 Release 流水线的运行编号（取它的 npm-packages 产物）"
        required: true
      publish:
        description: "构建后把资产补传到 Release"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-macos-${{ inputs.tag }}

jobs:
  build:
    name: 构建
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-macos-build.yml
    with:
      tag: ${{ inputs.tag }}
      release-run: ${{ inputs.release-run }}

  release:
    name: 补传到 Release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-assets
          path: ${{ runner.temp }}/assets
      # 只补缺的：同名资产已在而内容不同时失败，不覆盖（与 release.yml 的规则相同）。
      - name: 上传
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in "$RUNNER_TEMP/assets/"*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/existing" --clobber
              if cmp -s "$file" "$RUNNER_TEMP/existing/$name"; then echo "已在：$name"; continue; fi
              echo "Release 上已有不同内容的 $name" >&2; exit 1
            fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            echo "上传：$name"
          done
