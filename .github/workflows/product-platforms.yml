name: Product Platform Checks

on:
  pull_request:
    paths:
      - ".github/workflows/product-platforms.yml"
      - ".github/workflows/release-container.yml"
      - "packages/neuro-book/Dockerfile*"
      - "packages/neuro-book/**"
      - "packages/neuro-book-contracts/**"
      - "packages/neuro-book-test-support/**"
      - "packages/neuro-book-manager/**"
      - "packages/owned-process/**"
      - "packages/file-snapshot-cache/**"
      - "packages/nb-history/**"
      - "packages/nb-workflow/**"
      - "packages/nb-memory/**"
      - "packages/nb-ui/**"
      - "packages/neuro-agent-harness/**"
      - "packages/llmlint/**"
      - "scripts/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  product:
    name: ${{ matrix.platform }} Product
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-glibc
            runner: ubuntu-latest
            command: release:product:linux
            archive: neuro-book-product-linux-x64-glibc.tar.gz
            port: 39223
            browser: playwright
          - platform: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            command: release:product:linux-aarch64
            archive: neuro-book-product-linux-aarch64-glibc.tar.gz
            port: 39224
            browser: playwright
          - platform: darwin-x64
            runner: macos-15-intel
            command: release:product:darwin
            archive: neuro-book-product-darwin-x64.tar.gz
            port: 39225
            browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - platform: darwin-aarch64
            runner: macos-15
            command: release:product:darwin-aarch64
            archive: neuro-book-product-darwin-aarch64.tar.gz
            port: 39226
            browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --linker hoisted
      - id: runtime_policy
        name: Inspect Product Runtime Image policy
        shell: bash
        run: bun scripts/build/check-product-runtime-policies.ts --platform "${{ matrix.platform }}" --github-output
      - name: Measure unregistered Product platform
        if: steps.runtime_policy.outputs.registered != 'true'
        shell: bash
        run: bun run product:measure --output "${RUNNER_TEMP}/product-runtime-measurement-${{ matrix.platform }}.json"
      - name: Upload Product Runtime Image measurement
        if: always() && steps.runtime_policy.outputs.registered != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-runtime-measurement-${{ matrix.platform }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/product-runtime-measurement-${{ matrix.platform }}.json
      - name: Prepare approved Product release output
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun scripts/release/release-output.ts prepare --github-env
      - name: Verify POSIX Stage 0 behavior
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run test:install
      - name: Verify Manager platform contracts
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run manager:test
      - name: Verify Owned Process platform adapter
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run --cwd packages/owned-process test
      - name: Build approved Product Runtime Image
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run --cwd packages/neuro-book nuxt:build
      - name: Build Source archive for native verification
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run release:source
      - name: Build approved Product archive
        if: steps.runtime_policy.outputs.registered == 'true'
        run: bun run ${{ matrix.command }}
      - name: Install Playwright Chromium
        if: steps.runtime_policy.outputs.registered == 'true' && matrix.browser == 'playwright'
        run: bunx playwright-core install --with-deps chromium
      - name: Verify native Product
        if: steps.runtime_policy.outputs.registered == 'true'
        shell: bash
        run: |
          version="$(bun -e 'console.log(require("./packages/neuro-book/package.json").version)')"
          bash scripts/release/verify-posix-product.sh \
            "${{ matrix.platform }}" \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-source.zip" \
            "${NEURO_BOOK_RELEASE_DIR}/${{ matrix.archive }}" \
            "${version}" \
            "${{ matrix.port }}" \
            "${{ matrix.browser }}"
      - name: Upload native Product diagnostics
        if: failure() && steps.runtime_policy.outputs.registered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-product-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/application/.output
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/application/product-build.json
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/application/source-build.json
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/state
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/product.log
            ${{ runner.temp }}/neuro-book-${{ matrix.platform }}-smoke/browser-failure.png
