name: Code Baseline

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".omp/**"
      - "AGENTS.md"
      - "WATCHDOG.md"
      - "README.md"
      - "README.en.md"
      - "PROJECT-STATUS.md"
      - "docs/**"
      - "packages/neuro-book/**"
      - "packages/neuro-book-contracts/**"
      - "packages/neuro-book-test-support/**"
      - "packages/owned-process/**"
      - "packages/file-snapshot-cache/**"
      - "packages/nb-history/**"
      - "packages/nb-workflow/**"
      - "packages/nb-memory/**"
      - "packages/nb-ui/**"
      - "packages/neuro-agent-harness/**"
      - "packages/nb-harness/**"
      - "packages/nb-profile/**"
      - "packages/nb-session/**"
      - "packages/nb-runtime/**"
      - "packages/llmlint/**"
      - "packages/*/AGENTS.md"
      - "scripts/**"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/code-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

# v2 重建期间只检查治理与仓库合同；新应用的 typecheck 与测试 job 随应用骨架加入。
jobs:
  governance:
    name: Governance and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Check governance
        run: bun run governance:check
      - name: Typecheck repository scripts
        run: bun x tsc --noEmit -p scripts/tsconfig.json
      - name: Test repository scripts
        run: bun x vitest run --config scripts/vitest.config.ts
