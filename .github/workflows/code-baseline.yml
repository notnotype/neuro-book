name: Code Baseline (Advisory)

on:
  pull_request:
    paths:
      - "app/**"
      - "assets/**"
      - "packages/**"
      - "plugins/**"
      - "prisma/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "world-engine/**"
      - "*.d.ts"
      - ".env.example"
      - ".env.docker.example"
      - "Dockerfile*"
      - "bunfig.toml"
      - "config.example.yaml"
      - "docker-compose*.yml"
      - "nuxt.config.ts"
      - "prisma.config.ts"
      - "release-state-migration.json"
      - "tsconfig.json"
      - "uno.config.ts"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/code-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Generate Prisma clients
        run: bun run generate
      - name: Run typecheck
        run: bun run typecheck

  test:
    name: Full tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Generate Prisma clients
        run: bun run generate
      - name: Generate Nuxt types
        # vitest 依赖根 tsconfig.json extends ./.nuxt/tsconfig.json（见 tsconfig.json）；
        # 不先 prepare 生成 .nuxt/，oxc 解析 global-setup 等文件时会报 Tsconfig not found。
        run: bunx nuxt prepare
      - name: Run full tests
        run: bun run test -- --reporter=dot
