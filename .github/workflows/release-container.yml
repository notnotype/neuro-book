name: Release Product Assets

run-name: Release ${{ inputs.tag }} candidate #${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing Draft Release database ID
        required: true
        type: string
      tag:
        description: SemVer release tag owned by the Draft
        required: true
        type: string
      revision:
        description: Exact pushed Source revision
        required: true
        type: string
      prerelease:
        description: Whether the final Release remains a prerelease
        required: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-product-assets-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - name: Prepare generated sources
        run: bun run --cwd packages/neuro-book generate && bun run --cwd packages/neuro-book nuxt:prepare
      - name: Verify release process type contracts
        run: |
          bun x tsc --noEmit -p scripts/tsconfig.json
          bun run --cwd packages/owned-process typecheck
      - name: Verify approved Product Runtime Image policies
        run: bun run product:policy:check
      - name: Verify public Manager provenance
        run: bun run manager:verify-public
      - name: Verify Stage 0 and Manager contracts
        run: |
          bun run test:install
          bun run manager:test
          bun test scripts/deploy/product-start.test.ts
      - name: Verify Product Agent state root contract
        shell: bash
        timeout-minutes: 10
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT
          mkdir -p "${smoke_root}/application"
          NEURO_BOOK_APPLICATION_ROOT="${smoke_root}/application" \
          NEURO_BOOK_STATE_ROOT="${smoke_root}/state" \
          bun packages/neuro-book/scripts/deploy/product-agent-state-root-smoke.ts
      - name: Verify release asset contracts
        run: bun node_modules/vitest/vitest.mjs run --config scripts/release/release-assets-vitest.config.ts

  build-container:
    needs: preflight
    name: build-container-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-names
        name: Resolve lowercase image names
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/${owner}/neuro-book" >> "${GITHUB_OUTPUT}"

      - id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.app }}

      - id: app-build
        name: Build and push app image by digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/neuro-book/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEURO_BOOK_SOURCE_REVISION=${{ inputs.revision }}
          labels: ${{ steps.app-meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image-names.outputs.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Record app digest
        shell: bash
        run: |
          digest='${{ steps.app-build.outputs.digest }}'
          test "${digest}" != "${digest#sha256:}"
          mkdir -p /tmp/digests/app
          touch "/tmp/digests/app/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: container-app-digest-${{ matrix.arch }}
          path: /tmp/digests/app/*
          if-no-files-found: error
          retention-days: 1

  merge-container-images:
    needs: build-container
    runs-on: ubuntu-latest
    outputs:
      app-digest: ${{ steps.merge.outputs.app-digest }}
      app-image-name: ${{ steps.image-names.outputs.app }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-names
        name: Resolve lowercase image names
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/${owner}/neuro-book" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v4
        with:
          pattern: container-app-digest-*
          path: /tmp/digests/app
          merge-multiple: true

      - id: merge
        name: Merge native architecture images
        shell: bash
        env:
          APP_IMAGE: ${{ steps.image-names.outputs.app }}
          CANDIDATE_TAG: candidate-${{ inputs.release_id }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find /tmp/digests/app -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#digests[@]}" -eq 2
          refs=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            refs+=("${APP_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${APP_IMAGE}:${CANDIDATE_TAG}" "${refs[@]}"
          app_digest="sha256:$(docker buildx imagetools inspect "${APP_IMAGE}:${CANDIDATE_TAG}" --raw | sha256sum | awk '{print $1}')"
          [[ "$app_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "app-digest=${app_digest}" >> "$GITHUB_OUTPUT"

  source:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts
      - run: bun scripts/release/release-output.ts prepare --github-env
      - run: bun run release:source
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-source.zip

  product-linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - run: bun scripts/release/release-output.ts prepare --github-env
      - name: Verify Agent State Root paths
        run: bun run --cwd packages/neuro-book test:agent-state-root
      - run: bun run --cwd packages/neuro-book nuxt:build
      - run: bun run release:product:linux
      - uses: actions/upload-artifact@v4
        with:
          name: product-linux
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-linux-x64-glibc.tar.gz

  product-linux-aarch64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - run: bun scripts/release/release-output.ts prepare --github-env
      - run: bun run --cwd packages/neuro-book nuxt:build
      - run: bun run release:product:linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Install Playwright Chromium
        run: bunx playwright-core install --with-deps chromium
      - name: Verify Linux ARM64 Product
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          bash scripts/release/verify-posix-product.sh \
            linux-aarch64-glibc \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-source.zip" \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-linux-aarch64-glibc.tar.gz" \
            "${version#v}" \
            39127 \
            playwright
      - name: Upload Linux ARM64 Product diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-product-diagnostics
          if-no-files-found: ignore
          path: ${{ runner.temp }}/neuro-book-linux-aarch64-glibc-smoke/*
      - uses: actions/upload-artifact@v4
        with:
          name: product-linux-aarch64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-linux-aarch64-glibc.tar.gz

  product-darwin-x64:
    needs: source
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - run: bun scripts/release/release-output.ts prepare --github-env
      - name: Verify macOS Stage 0 and Manager adapters
        run: |
          bun run test:install
          bun run manager:test
      - run: bun run --cwd packages/neuro-book nuxt:build
      - run: bun run release:product:darwin
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Verify macOS x64 Product
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          bash scripts/release/verify-posix-product.sh \
            darwin-x64 \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-source.zip" \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-darwin-x64.tar.gz" \
            "${version#v}" \
            39125 \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - uses: actions/upload-artifact@v4
        with:
          name: product-darwin-x64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-darwin-x64.tar.gz

  product-darwin-aarch64:
    needs: source
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - run: bun scripts/release/release-output.ts prepare --github-env
      - run: bun run --cwd packages/neuro-book nuxt:build
      - run: bun run release:product:darwin-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Verify macOS ARM64 Product
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          bash scripts/release/verify-posix-product.sh \
            darwin-aarch64 \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-source.zip" \
            "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-darwin-aarch64.tar.gz" \
            "${version#v}" \
            39126 \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - uses: actions/upload-artifact@v4
        with:
          name: product-darwin-aarch64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-darwin-aarch64.tar.gz

  product-windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: windows-dependencies
        name: Restore Windows Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'packages/neuro-book/package.json', 'packages/neuro-book-contracts/package.json', 'packages/neuro-book-manager/package.json') }}
      - name: Verify cached Windows dependencies
        run: bun scripts/release/install-dependencies.ts --linker hoisted
      - run: bun scripts/release/release-output.ts prepare --github-env
      - name: Verify Windows Manager adapters
        run: |
          bun run --cwd packages/neuro-book nuxt:prepare
          bun run manager:test
      - name: Verify Windows Owned Process lifecycle
        run: bun run --cwd packages/owned-process test && bun run test:windows-owned-process
      - name: Verify Agent State Root paths
        run: bun run --cwd packages/neuro-book test:agent-state-root
      - run: bun run --cwd packages/neuro-book nuxt:build
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - run: bun run release:product:windows
      - name: Build Manager bundle for portable embedding
        run: bun run manager:build
      - run: bun run package:windows-portable
      - uses: actions/upload-artifact@v4
        with:
          name: product-windows
          path: |
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-windows-x64.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-windows-x64.zip

  assemble:
    needs: [merge-container-images, source, product-linux, product-linux-aarch64, product-darwin-x64, product-darwin-aarch64, product-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts
      - run: bun scripts/release/release-output.ts prepare --github-env
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: product-linux
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: product-linux-aarch64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: product-darwin-x64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: product-darwin-aarch64
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: product-windows
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Build release manifest
        shell: bash
        env:
          GHCR_DIGEST: ${{ needs.merge-container-images.outputs.app-digest }}
          APP_IMAGE_NAME: ${{ needs.merge-container-images.outputs.app-image-name }}
        run: |
          manager_version="$(bun -e 'console.log(require("./packages/neuro-book-manager/package.json").version)')"
          manager_root="${RUNNER_TEMP:?}/manager-npm"
          rm -rf "${manager_root}"
          mkdir -p "${manager_root}/package"
          npm pack "@notnotype/neuro-book-manager@${manager_version}" --pack-destination "${manager_root}" >/dev/null
          tar -xzf "${manager_root}"/*.tgz -C "${manager_root}"
          test "$(bun "${manager_root}/package/dist/neuro-book.mjs" --version)" = "${manager_version}"
          unzip -p "${NEURO_BOOK_RELEASE_DIR}/neuro-book-windows-x64.zip" ".runtime/manager/${manager_version}/neuro-book.mjs" > "${manager_root}/portable-neuro-book.mjs"
          cmp "${manager_root}/package/dist/neuro-book.mjs" "${manager_root}/portable-neuro-book.mjs"
          bun scripts/release/release-assets.ts manifest \
            --tag "${{ inputs.tag }}" \
            --revision "${{ inputs.revision }}" \
            --manager-version "${manager_version}" \
            --ghcr-ref "${APP_IMAGE_NAME}@${GHCR_DIGEST}" \
            --ghcr-digest "${GHCR_DIGEST}"
          MANAGER_ROOT="${manager_root}" bun -e 'const schema = await import(`${process.env.MANAGER_ROOT}/package/dist/schema.mjs`); const manifest = await Bun.file(`${process.env.NEURO_BOOK_RELEASE_DIR}/release-manifest.json`).json(); schema.parseReleaseManifest(manifest);'
      - name: Upload candidate release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-source.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-windows-x64.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-linux-x64-glibc.tar.gz
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-linux-aarch64-glibc.tar.gz
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-darwin-x64.tar.gz
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-darwin-aarch64.tar.gz
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-windows-x64.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/release-manifest.json
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/SHA256SUMS
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/install.ps1
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/install.cmd
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/install.sh

  verify-linux:
    needs: [assemble, merge-container-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Verify assets and native packages
        run: bun scripts/release/release-assets.ts verify --dir candidate-assets --tag "${{ inputs.tag }}" --revision "${{ inputs.revision }}"
      - name: Verify POSIX Stage 0 syntax
        run: bash -n candidate-assets/install.sh
      - name: Verify GHCR digest and source revision
        env:
          IMAGE: ${{ needs.merge-container-images.outputs.app-image-name }}@${{ needs.merge-container-images.outputs.app-digest }}
        run: |
          docker pull "${IMAGE}"
          test "$(docker image inspect "${IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ inputs.revision }}"
      - name: Verify Linux Product Runtime Contract
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP:?}/neuro-book-linux-product-smoke"
          product_root="${smoke_root}/application"
          state_root="${smoke_root}/state"
          rm -rf "${smoke_root}"
          mkdir -p "${product_root}"
          unzip -q candidate-assets/neuro-book-source.zip -d "${product_root}"
          tar -xpzf candidate-assets/neuro-book-product-linux-x64-glibc.tar.gz -C "${product_root}"
          mkdir -p "${state_root}/workspace"
          test ! -e "${product_root}/node_modules"
          bun --no-install --no-env-file scripts/release/verify-extracted-product.ts --product-root "${product_root}"
          (
            cd "${product_root}"
            NEURO_BOOK_APPLICATION_ROOT="${product_root}" \
            NEURO_BOOK_STATE_ROOT="${state_root}" \
            bun --no-install --no-env-file .output/server/commands/product-command.mjs check all
          )
          test ! -e "${product_root}/workspace"
          test -d "${state_root}/workspace"
      - name: Verify Linux Product in a real browser
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP:?}/neuro-book-linux-product-smoke"
          product_root="${smoke_root}/application"
          state_root="${smoke_root}/browser-state"
          log_path="${smoke_root}/product-browser-smoke.log"
          rm -rf "${state_root}"
          mkdir -p "${state_root}/workspace" "${state_root}/logs"
          cat > "${state_root}/config.yaml" <<'EOF'
          server:
            host: 0.0.0.0
            port: 39124
          database:
            kind: sqlite
            url: file:workspace/.nbook/neuro-book.sqlite
          auth:
            enabled: false
          EOF
          version="${{ inputs.tag }}"
          version="${version#v}"
          port=39124
          export NODE_ENV=production
          export NUXT_PORT="${port}"
          export PORT="${port}"
          export NEURO_BOOK_APPLICATION_ROOT="${product_root}"
          export NEURO_BOOK_STATE_ROOT="${state_root}"
          bun --no-install --no-env-file "${product_root}/.output/server/commands/product-command.mjs" command migrate-application-state --apply
          setsid bun --no-install --no-env-file "${product_root}/.output/server/commands/product-command.mjs" command start >"${log_path}" 2>&1 &
          product_pid=$!
          cleanup() {
            kill -- "-${product_pid}" 2>/dev/null || true
            wait "${product_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${port}/api/app/version" >/dev/null; then break; fi
            if ! kill -0 "${product_pid}" 2>/dev/null; then
              cat "${log_path}"
              exit 1
            fi
            sleep 0.5
          done
          if ! curl --fail --silent "http://127.0.0.1:${port}/api/app/version" >/dev/null; then
            cat "${log_path}"
            exit 1
          fi
          if ! node --import tsx scripts/deploy/product-browser-smoke.ts \
            --url "http://127.0.0.1:${port}" \
            --expected-version "${version}" \
            --browser-executable /usr/bin/google-chrome \
            --screenshot "${smoke_root}/product-browser-smoke-failure.png"; then
            cat "${log_path}"
            exit 1
          fi
      - name: Public Manager CLI smoke
        shell: bash
        run: |
          manager_version="$(node -p 'require("./packages/neuro-book-manager/package.json").version')"
          bunx --bun "@notnotype/neuro-book-manager@${manager_version}" --version
          bunx --bun "@notnotype/neuro-book-manager@${manager_version}" status --help
      - name: Upload Linux browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-product-browser-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/neuro-book-linux-product-smoke/product-browser-smoke.log
            ${{ runner.temp }}/neuro-book-linux-product-smoke/product-browser-smoke-failure.png
            ${{ runner.temp }}/neuro-book-linux-product-smoke/state/logs/**
            ${{ runner.temp }}/neuro-book-linux-product-smoke/state/workspace/.nbook/logs/**
            ${{ runner.temp }}/neuro-book-linux-product-smoke/browser-state/logs/**

  verify-windows:
    needs: [assemble]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Verify Portable executables and doctor
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "neuro-book-portable-smoke"
          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath candidate-assets/neuro-book-windows-x64.zip -DestinationPath $portableRoot
          $portableRoot = (Resolve-Path -LiteralPath $portableRoot).Path
          bun scripts/release/verify-windows-portable.ts `
            --release-manifest candidate-assets/release-manifest.json `
            --portable-archive candidate-assets/neuro-book-windows-x64.zip `
            --portable-root $portableRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Portable最终发行身份验证失败：$LASTEXITCODE"
          }
          $manifest = Get-Content -Raw (Join-Path $portableRoot ".deploy/installation.json") | ConvertFrom-Json
          & (Join-Path $portableRoot $manifest.components.managerRuntime.path) --version
          & (Join-Path $portableRoot $manifest.components.tools.rg.path) --version
          & (Join-Path $portableRoot $manifest.components.tools.git.path) --version
          & (Join-Path $portableRoot $manifest.components.tools.git.bashPath) --version
          $launcherNames = @(
            "Start Neuro Book.cmd", "Start Neuro Book.ps1",
            "Update Neuro Book.cmd", "Update Neuro Book.ps1",
            "Create Admin.cmd", "Create Admin.ps1"
          )
          foreach ($launcherName in $launcherNames) {
            $launcherPath = Join-Path $portableRoot $launcherName
            if (-not (Test-Path -LiteralPath $launcherPath)) { throw "Portable缺少Launcher：$launcherName" }
            $launcher = Get-Content -Raw -LiteralPath $launcherPath
            if ($launcher -notmatch "(?i)\.runtime[\\/]bin[\\/]neuro-book\.cmd" -or $launcher -match "(?i)--root") {
              throw "Portable Launcher未委托绑定Root的Manager wrapper：$launcherName"
            }
          }
          $env:NO_COLOR = "1"
          $manager = Join-Path $portableRoot ".runtime/bin/neuro-book.cmd"
          $doctorOutput = @(& $manager --root $portableRoot doctor --json)
          $doctorExitCode = $LASTEXITCODE
          if ($doctorExitCode -ne 0) {
            $doctorOutput | Write-Host
            throw "Portable doctor执行失败，退出码$doctorExitCode"
          }
          $doctor = ($doctorOutput -join "`n") | ConvertFrom-Json
          if (-not $doctor.healthy) {
            $doctor.checks |
              Where-Object { $_.status -eq "fail" } |
              ForEach-Object {
                Write-Host ("[FAIL] {0}: {1}" -f $_.id, $_.message)
                if ($_.remediation) { Write-Host ("       修复建议：{0}" -f $_.remediation) }
              }
            throw "Portable doctor 未通过"
          }
          $portableBun = Join-Path $portableRoot $manifest.components.applicationRuntime.path
          $portableBash = Join-Path $portableRoot $manifest.components.tools.git.bashPath
          & $portableBun (Join-Path $portableRoot "packages/owned-process/tests/windows-release-smoke.ts") --bash $portableBash
          if ($LASTEXITCODE -ne 0) {
            throw "候选Portable Bun + PortableGit Owned Process smoke失败：$LASTEXITCODE"
          }
          $managerBackup = "$manager.release-verify-backup"
          Copy-Item -LiteralPath $manager -Destination $managerBackup
          try {
            Set-Content -LiteralPath $manager -Encoding ascii -Value @'
          @echo off
          > "%NEURO_BOOK_LAUNCHER_CAPTURE%" echo %~1
          if not "%~2"=="" >> "%NEURO_BOOK_LAUNCHER_CAPTURE%" echo %~2
          if not "%~3"=="" >> "%NEURO_BOOK_LAUNCHER_CAPTURE%" echo %~3
          if not "%~4"=="" >> "%NEURO_BOOK_LAUNCHER_CAPTURE%" echo %~4
          exit /b 0
          '@
            $cmdCases = @(
              @{ Name = "Start Neuro Book.cmd"; Expected = @("start") },
              @{ Name = "Update Neuro Book.cmd"; Expected = @("update") },
              @{ Name = "Create Admin.cmd"; Expected = @("admin", "create") }
            )
            foreach ($case in $cmdCases) {
              $capture = Join-Path $portableRoot ".deploy/launcher-args.txt"
              Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue
              $env:NEURO_BOOK_LAUNCHER_CAPTURE = $capture
              & (Join-Path $portableRoot $case.Name)
              if ($LASTEXITCODE -ne 0) { throw "Portable CMD Launcher执行失败：$($case.Name)" }
              $actual = @(Get-Content -LiteralPath $capture)
              if (Compare-Object -ReferenceObject $case.Expected -DifferenceObject $actual) {
                throw "Portable CMD Launcher参数错误：$($case.Name)，实际参数：$($actual -join ' | ')"
              }
            }
          } finally {
            Remove-Item Env:NEURO_BOOK_LAUNCHER_CAPTURE -ErrorAction SilentlyContinue
            Move-Item -LiteralPath $managerBackup -Destination $manager -Force
          }
      - name: Verify Windows Portable Runtime Contract
        shell: pwsh
        run: |
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "neuro-book-portable-smoke")).Path
          $manifest = Get-Content -Raw (Join-Path $portableRoot ".deploy/installation.json") | ConvertFrom-Json
          $bun = Join-Path $portableRoot $manifest.components.applicationRuntime.path
          $scratchRoot = Join-Path $env:RUNNER_TEMP "neuro-book-windows-product-contract"
          bun scripts/release/verify-windows-product.ts `
            --product-root $portableRoot `
            --scratch-root $scratchRoot `
            --bun-runtime $bun `
            --installation-manifest (Join-Path $portableRoot ".deploy/installation.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Portable Runtime Contract smoke失败：$LASTEXITCODE"
          }
      - name: Verify Windows Portable shadow workspace diagnosis
        shell: pwsh
        run: |
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "neuro-book-portable-smoke")).Path
          $manager = Join-Path $portableRoot ".runtime/bin/neuro-book.cmd"
          $stateWorkspace = Join-Path $portableRoot "data/workspace"
          $shadowWorkspace = Join-Path $portableRoot "workspace"
          $stateMarker = Join-Path $stateWorkspace ".task109-state-marker"
          $shadowMarker = Join-Path $shadowWorkspace ".task109-shadow-marker"
          if (Test-Path -LiteralPath $shadowWorkspace) {
            throw "Portable安装根已有workspace，无法建立隔离shadow诊断夹具"
          }
          New-Item -ItemType Directory -Path $stateWorkspace -Force | Out-Null
          Set-Content -LiteralPath $stateMarker -Value "state-root" -Encoding ascii
          New-Item -ItemType Directory -Path $shadowWorkspace -Force | Out-Null
          Set-Content -LiteralPath $shadowMarker -Value "shadow-root" -Encoding ascii
          $env:NO_COLOR = "1"
          try {
            $doctorOutput = @(& $manager --root $portableRoot doctor --json)
            $doctorExitCode = $LASTEXITCODE
            $doctor = ($doctorOutput -join "`n") | ConvertFrom-Json
            $shadowCheck = @($doctor.checks | Where-Object { $_.id -eq "state.shadow-workspace" })
            if ($shadowCheck.Count -ne 1 -or $shadowCheck[0].status -ne "fail") {
              $doctorOutput | Write-Host
              throw "Portable shadow workspace未被doctor诊断为fail（exit=$doctorExitCode）"
            }
            if (-not $shadowCheck[0].remediation -or $shadowCheck[0].remediation -notmatch "workspace") {
              throw "Portable shadow workspace诊断缺少可执行remediation"
            }
            if ((Get-Content -Raw -LiteralPath $stateMarker).Trim() -ne "state-root") {
              throw "Portable shadow诊断修改了真实State Root数据"
            }
            if ((Get-Content -Raw -LiteralPath $shadowMarker) -notmatch "shadow-root") {
              throw "Portable shadow诊断修改了影子目录数据"
            }
          } finally {
            Remove-Item -LiteralPath $shadowWorkspace -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stateMarker -Force -ErrorAction SilentlyContinue
            Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $shadowWorkspace) {
            throw "Portable shadow workspace测试目录未清理"
          }
      - name: Verify Windows Portable browser, authenticated restart and lifecycle
        shell: pwsh
        run: |
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "neuro-book-portable-smoke")).Path
          $chrome = Join-Path $env:ProgramFiles "Google/Chrome/Application/chrome.exe"
          if (-not (Test-Path -LiteralPath $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} "Microsoft/Edge/Application/msedge.exe"
          }
          bun scripts/release/verify-windows-portable-restart.ts `
            --portable-root $portableRoot `
            --browser-executable $chrome
          if ($LASTEXITCODE -ne 0) {
            throw "Portable浏览器、鉴权与重启生命周期验收失败：$LASTEXITCODE"
          }
      - name: Verify Windows Portable self-uninstall
        shell: pwsh
        run: |
          function Expand-VerifiedPortable([string]$root) {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath candidate-assets/neuro-book-windows-x64.zip -DestinationPath $root
            bun scripts/release/verify-windows-portable.ts `
              --release-manifest candidate-assets/release-manifest.json `
              --portable-archive candidate-assets/neuro-book-windows-x64.zip `
              --portable-root $root
            if ($LASTEXITCODE -ne 0) { throw "Portable卸载夹具身份验证失败：$LASTEXITCODE" }
          }

          $preserveRoot = Join-Path $env:RUNNER_TEMP "neuro-book-portable-uninstall-preserve"
          Expand-VerifiedPortable $preserveRoot
          $preserveManifest = Get-Content -Raw (Join-Path $preserveRoot ".deploy/installation.json") | ConvertFrom-Json
          $preserveMarker = Join-Path $preserveRoot "data/workspace/.release-uninstall-preserve"
          New-Item -ItemType Directory -Path (Split-Path $preserveMarker) -Force | Out-Null
          Set-Content -LiteralPath $preserveMarker -Value "preserve" -Encoding ascii
          $uninstallResultRoot = Join-Path $env:LOCALAPPDATA "NeuroBook/uninstall-results"
          $preserveResultsBefore = @(Get-ChildItem -LiteralPath $uninstallResultRoot -Filter "*.json" -ErrorAction SilentlyContinue | ForEach-Object FullName)
          & (Join-Path $preserveRoot $preserveManifest.components.managerRuntime.path) `
            (Join-Path $preserveRoot $preserveManifest.components.manager.path) `
            --root $preserveRoot uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "Portable默认卸载调度失败：$LASTEXITCODE" }
          $preserveResultPath = $null
          for ($attempt = 0; $attempt -lt 240; $attempt++) {
            $newResults = @(Get-ChildItem -LiteralPath $uninstallResultRoot -Filter "*.json" -ErrorAction SilentlyContinue | Where-Object { $preserveResultsBefore -notcontains $_.FullName })
            if ($newResults.Count -gt 1) { throw "Portable默认卸载产生了多个结果文件" }
            if ($newResults.Count -eq 1) { $preserveResultPath = $newResults[0].FullName; break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $preserveResultPath) { throw "Portable默认卸载Host没有在超时前写入结果" }
          $preserveResult = Get-Content -Raw -LiteralPath $preserveResultPath | ConvertFrom-Json
          if (-not $preserveResult.ok -or $preserveResult.installationRoot -ne $preserveRoot) {
            throw "Portable默认卸载Host结果失败：$($preserveResult | ConvertTo-Json -Compress)"
          }
          $preserveChildren = @(Get-ChildItem -LiteralPath $preserveRoot -Force | ForEach-Object Name)
          if (-not (Test-Path -LiteralPath $preserveMarker -PathType Leaf) -or $preserveChildren.Count -ne 1 -or $preserveChildren[0] -ne "data") {
            throw "Portable默认卸载没有在退出后只保留data：$($preserveChildren -join ', ')"
          }

          $deleteRoot = Join-Path $env:RUNNER_TEMP "neuro-book-portable-uninstall-all"
          Expand-VerifiedPortable $deleteRoot
          $deleteManifest = Get-Content -Raw (Join-Path $deleteRoot ".deploy/installation.json") | ConvertFrom-Json
          $deleteResultsBefore = @(Get-ChildItem -LiteralPath $uninstallResultRoot -Filter "*.json" -ErrorAction SilentlyContinue | ForEach-Object FullName)
          & (Join-Path $deleteRoot $deleteManifest.components.managerRuntime.path) `
            (Join-Path $deleteRoot $deleteManifest.components.manager.path) `
            --root $deleteRoot uninstall --delete-data --yes
          if ($LASTEXITCODE -ne 0) { throw "Portable全量卸载调度失败：$LASTEXITCODE" }
          $deleteResultPath = $null
          for ($attempt = 0; $attempt -lt 240; $attempt++) {
            $newResults = @(Get-ChildItem -LiteralPath $uninstallResultRoot -Filter "*.json" -ErrorAction SilentlyContinue | Where-Object { $deleteResultsBefore -notcontains $_.FullName })
            if ($newResults.Count -gt 1) { throw "Portable全量卸载产生了多个结果文件" }
            if ($newResults.Count -eq 1) { $deleteResultPath = $newResults[0].FullName; break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $deleteResultPath) { throw "Portable全量卸载Host没有在超时前写入结果" }
          $deleteResult = Get-Content -Raw -LiteralPath $deleteResultPath | ConvertFrom-Json
          if (-not $deleteResult.ok -or $deleteResult.installationRoot -ne $deleteRoot) {
            throw "Portable全量卸载Host结果失败：$($deleteResult | ConvertTo-Json -Compress)"
          }
          if (Test-Path -LiteralPath $deleteRoot) { throw "Portable全量卸载没有在退出后删除Installation Root" }
      - name: Verify Windows Stage 0 syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path candidate-assets/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $cmd = Get-Content -Raw candidate-assets/install.cmd
          if ($cmd -notmatch "install\.ps1") { throw "install.cmd未委托install.ps1" }
      - name: Upload Windows browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-browser-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/neuro-book-portable-smoke/data/logs/release-browser-smoke*
            ${{ runner.temp }}/neuro-book-portable-smoke/data/logs/release-auth-smoke*
            ${{ runner.temp }}/neuro-book-portable-smoke/data-moved/logs/**
            ${{ runner.temp }}/neuro-book-portable-smoke/data-moved/workspace/.nbook/logs/**

  verify:
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release verification completed."

  publish-payload:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts
      - run: bun scripts/release/release-output.ts prepare --github-env
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Publish verified payload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release/draft-release-assets.ts \
            --repo "${GITHUB_REPOSITORY}" \
            --release-id "${{ inputs.release_id }}" \
            --tag "${{ inputs.tag }}" \
            --file \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-source.zip" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-windows-x64.zip" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-linux-x64-glibc.tar.gz" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-linux-aarch64-glibc.tar.gz" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-darwin-x64.tar.gz" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-product-darwin-aarch64.tar.gz" \
              "${NEURO_BOOK_RELEASE_DIR}/neuro-book-windows-x64.zip" \
              "${NEURO_BOOK_RELEASE_DIR}/install.ps1" \
              "${NEURO_BOOK_RELEASE_DIR}/install.cmd" \
              "${NEURO_BOOK_RELEASE_DIR}/install.sh"

  verify-public-payload:
    needs: [publish-payload, merge-container-images]
    runs-on: ubuntu-latest
    permissions:
      # GitHub App tokens require Release write access to download Draft asset bytes.
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts --linker hoisted
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Download Draft payload assets by release ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          mkdir public-assets
          cp candidate-assets/release-manifest.json candidate-assets/SHA256SUMS public-assets/
          for asset in \
            neuro-book-source.zip \
            neuro-book-product-windows-x64.zip \
            neuro-book-product-linux-x64-glibc.tar.gz \
            neuro-book-product-linux-aarch64-glibc.tar.gz \
            neuro-book-product-darwin-x64.tar.gz \
            neuro-book-product-darwin-aarch64.tar.gz \
            neuro-book-windows-x64.zip \
            install.ps1 \
            install.cmd \
            install.sh; do
            asset_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${asset}\") | .id")"
            [[ "${asset_id}" =~ ^[0-9]+$ ]]
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "public-assets/${asset}"
          done
      - name: Verify public payload bytes and checksums
        run: bun scripts/release/release-assets.ts verify --dir public-assets --tag "${{ inputs.tag }}" --revision "${{ inputs.revision }}"
      - name: Verify public GHCR digest
        env:
          IMAGE: ${{ needs.merge-container-images.outputs.app-image-name }}@${{ needs.merge-container-images.outputs.app-digest }}
          APP_IMAGE_NAME: ${{ needs.merge-container-images.outputs.app-image-name }}
        run: |
          docker pull "${IMAGE}"
          test "$(docker image inspect "${IMAGE}" --format '{{ index .RepoDigests 0 }}')" = "${APP_IMAGE_NAME}@${{ needs.merge-container-images.outputs.app-digest }}"

  verify-public-ghcr-amd64:
    needs: [verify-public-payload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Verify public GHCR on Linux x64 Docker
        shell: bash
        run: |
          set -euo pipefail
          manager_version="$(node -p 'require("./packages/neuro-book-manager/package.json").version')"
          candidate_manifest="$PWD/candidate-assets/release-manifest.json"
          bash scripts/release/verify-public-ghcr.sh \
            "$manager_version" "$candidate_manifest" \
            "${RUNNER_TEMP}/public-ghcr-amd64" 39487 docker

  verify-public-ghcr-arm64:
    needs: [verify-public-payload]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Verify public GHCR on Linux ARM64 Docker
        shell: bash
        run: |
          set -euo pipefail
          manager_version="$(node -p 'require("./packages/neuro-book-manager/package.json").version')"
          candidate_manifest="$PWD/candidate-assets/release-manifest.json"
          bash scripts/release/verify-public-ghcr.sh \
            "$manager_version" "$candidate_manifest" \
            "${RUNNER_TEMP}/public-ghcr-arm64" 39488 docker

  verify-public-ghcr-podman:
    needs: [verify-public-payload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Install rootless Podman and Compose
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose
          podman info
          PODMAN_COMPOSE_PROVIDER=podman-compose podman compose version
      - name: Verify public GHCR on Linux x64 rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          manager_version="$(node -p 'require("./packages/neuro-book-manager/package.json").version')"
          candidate_manifest="$PWD/candidate-assets/release-manifest.json"
          bash scripts/release/verify-public-ghcr.sh \
            "$manager_version" "$candidate_manifest" \
            "${RUNNER_TEMP}/public-ghcr-podman" 39489 podman

  verify-public-ghcr-podman-delegate:
    needs: [verify-public-payload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Install Podman and mask podman-compose outside PATH
        shell: bash
        env:
          PODMAN_COMPOSE_MASKED_ROOT: ${{ runner.temp }}/podman-compose-masked
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman
          mkdir -p "$PODMAN_COMPOSE_MASKED_ROOT/deb"
          cd "$PODMAN_COMPOSE_MASKED_ROOT/deb"
          apt-get download podman-compose
          dpkg -x ./*.deb "$PODMAN_COMPOSE_MASKED_ROOT/root"
          masked_bin="$PODMAN_COMPOSE_MASKED_ROOT/root/usr/bin/podman-compose"
          test -x "$masked_bin"
          echo "podman-compose 已保留安装在 PATH 之外：$masked_bin"
          if ! command -v docker-compose >/dev/null 2>&1; then
              plugin=""
              for candidate_path in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose; do
                  if [[ -x "$candidate_path" ]]; then plugin="$candidate_path"; break; fi
              done
              if [[ -z "$plugin" ]]; then
                  sudo apt-get install --yes docker-compose-v2
                  plugin="/usr/libexec/docker/cli-plugins/docker-compose"
              fi
              sudo ln -sf "$plugin" /usr/local/bin/docker-compose
          fi
          command -v docker-compose
          if command -v podman-compose >/dev/null 2>&1; then
              echo "隔离失败：podman-compose 不允许存在于 PATH。" >&2
              exit 1
          fi
          systemctl --user enable --now podman.socket
          podman info
          podman compose version
          # 持久化 sanitized PATH：逐行写入（每行一个目录条目，不能写整串 PATH=...），
          # 并显式剔除 masked 根前缀，防止任何后续步骤意外纳入。
          printf '%s\n' "$(printf '%s' "$PATH" | tr ':' '\n' | grep -v "^$PODMAN_COMPOSE_MASKED_ROOT")" >> "$GITHUB_PATH"
      - name: Verify public GHCR on Linux x64 rootless Podman via delegated provider
        shell: bash
        env:
          PODMAN_COMPOSE_MASKED_ROOT: ${{ runner.temp }}/podman-compose-masked
        run: |
          set -euo pipefail
          test -x "$PODMAN_COMPOSE_MASKED_ROOT/root/usr/bin/podman-compose"
          if command -v podman-compose >/dev/null 2>&1; then
              echo "隔离失败：podman-compose 不允许存在于 PATH。" >&2
              exit 1
          fi
          command -v docker-compose
          manager_version="$(node -p 'require("./packages/neuro-book-manager/package.json").version')"
          candidate_manifest="$PWD/candidate-assets/release-manifest.json"
          bash scripts/release/verify-public-ghcr.sh \
            "$manager_version" "$candidate_manifest" \
            "${RUNNER_TEMP}/public-ghcr-podman-delegate" 39490 podman delegate

  verify-public-windows-data-reuse:
    needs: [verify-public-payload]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      BASELINE_RELEASE_TAG: v0.8.6-canary.20260717.130406Z.a91a96f
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Reinstall Manifest v5 Portable and reuse complete 0.8.6 data
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP "portable-v3-baseline"
          $root = Join-Path $env:RUNNER_TEMP "portable-v5-candidate"
          $archive = Join-Path $env:RUNNER_TEMP "portable-0.8.6.zip"
          $candidateArchive = (Resolve-Path candidate-assets/neuro-book-windows-x64.zip).Path
          $candidateRelease = Get-Content -Raw candidate-assets/release-manifest.json | ConvertFrom-Json
          $managerVersion = (Get-Content -Raw packages/neuro-book-manager/package.json | ConvertFrom-Json).version
          $port = 39327
          Remove-Item -LiteralPath $baselineRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:BASELINE_RELEASE_TAG/neuro-book-windows-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $baselineRoot
          $baselineManifest = Get-Content -Raw (Join-Path $baselineRoot ".deploy/installation.json") | ConvertFrom-Json
          if ($baselineManifest.schemaVersion -ne 3) { throw "Baseline不是Installation Manifest v3" }
          $envPath = Join-Path $baselineRoot "data/.env"
          $databasePath = Join-Path $baselineRoot "data/workspace/.nbook/neuro-book.sqlite"
          $absoluteDatabaseUrl = "file:" + $databasePath.Replace("\", "/")
          $envText = Get-Content -Raw $envPath
          $envText = $envText -replace '(?m)^DATABASE_URL=.*$', "DATABASE_URL=$absoluteDatabaseUrl"
          $envText = $envText -replace '(?m)^NUXT_PORT=.*$', "NUXT_PORT=$port"
          $envText = $envText -replace '(?m)^PORT=.*$', "PORT=$port"
          Set-Content -LiteralPath $envPath -Value $envText -Encoding utf8
          $env:AUTH_ADMIN_PASSWORD = "release-update-password"
          try {
            $oldManager = Join-Path $baselineRoot ".runtime/bin/neuro-book.cmd"
            & $oldManager --root $baselineRoot admin create release-update-admin
            if ($LASTEXITCODE -ne 0) { throw "0.8.6 create admin failed: $LASTEXITCODE" }
          } finally {
            Remove-Item Env:AUTH_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          }
          $envText = Get-Content -Raw $envPath
          $envText = $envText -replace '(?m)^DATABASE_URL=.*$', 'DATABASE_URL=file:./workspace/.nbook/neuro-book.sqlite'
          Set-Content -LiteralPath $envPath -Value $envText -Encoding utf8
          $marker = Join-Path $baselineRoot "data/workspace/.nbook/v3-data-reuse-marker.txt"
          Set-Content -LiteralPath $marker -Value "preserve-complete-data" -Encoding ascii

          Expand-Archive -LiteralPath $candidateArchive -DestinationPath $root
          $candidateManifestPath = Join-Path $root ".deploy/installation.json"
          $candidateManifest = Get-Content -Raw $candidateManifestPath | ConvertFrom-Json
          if ($candidateManifest.schemaVersion -ne 5) { throw "Candidate不是Installation Manifest v5" }
          if ($candidateManifest.managerVersion -ne $managerVersion) { throw "Candidate Manager版本与精确npm版本不一致" }
          if ($candidateManifest.appVersion -ne $candidateRelease.version) { throw "Candidate应用版本不一致" }
          Remove-Item -LiteralPath (Join-Path $root "data") -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $baselineRoot "data") -Destination (Join-Path $root "data") -Recurse
          $envPath = Join-Path $root "data/.env"
          $databasePath = Join-Path $root "data/workspace/.nbook/neuro-book.sqlite"
          if (-not (Test-Path -LiteralPath (Join-Path $root "data/workspace/.nbook/v3-data-reuse-marker.txt") -PathType Leaf)) {
            throw "完整data复用丢失用户标记"
          }
          if ((Get-Content -Raw $envPath) -notmatch '(?m)^DATABASE_URL=file:\./workspace/\.nbook/neuro-book\.sqlite$') { throw "data复用没有保留逻辑DATABASE_URL" }
          if (-not (Test-Path -LiteralPath $databasePath -PathType Leaf)) { throw "Portable update丢失App SQLite" }
          if (Test-Path -LiteralPath (Join-Path $root "workspace")) { throw "Portable重装创建了影子workspace" }
          $stdout = Join-Path $root "data/logs/public-data-reuse.stdout.log"
          $stderr = Join-Path $root "data/logs/public-data-reuse.stderr.log"
          $managerRuntime = Join-Path $root $candidateManifest.components.managerRuntime.path
          $managerBundle = Join-Path $root $candidateManifest.components.manager.path
          $managerArguments = @("`"$managerBundle`"", "--root", "`"$root`"", "start")
          $managerProcess = Start-Process -FilePath $managerRuntime -ArgumentList $managerArguments -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 240; $attempt++) {
              if ($managerProcess.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/app/version" -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Get-Content -Raw $stdout -ErrorAction SilentlyContinue | Write-Host
              Get-Content -Raw $stderr -ErrorAction SilentlyContinue | Write-Host
              throw "Updated Portable did not become ready"
            }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $body = @{username = "release-update-admin"; password = "release-update-password"} | ConvertTo-Json -Compress
            $login = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/auth/login" -Method Post -ContentType "application/json" -Body $body -WebSession $session -TimeoutSec 10
            if ($login.StatusCode -ne 200 -or $session.Cookies.Count -lt 1) { throw "Updated Portable login failed" }
            $me = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/auth/me" -WebSession $session -TimeoutSec 10
            if ($me.StatusCode -ne 200) { throw "Updated Portable session failed" }
          } finally {
            if (-not $managerProcess.HasExited) {
              Stop-Process -Id $managerProcess.Id -Force
              [void]$managerProcess.WaitForExit(10000)
            }
            $released = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $port)
                $probe.Start()
                $probe.Stop()
                $released = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $released) { throw "关闭更新后Portable Manager后端口仍未释放：$port" }
          }
          if (-not (Test-Path -LiteralPath $marker.Replace($baselineRoot, $root) -PathType Leaf)) { throw "启动后用户标记丢失" }
      - name: Cleanup public Portable data reuse
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "portable-v3-baseline") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "portable-v5-candidate") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "portable-0.8.6.zip") -Force -ErrorAction SilentlyContinue

  publish-index:
    needs: [verify-public-ghcr-amd64, verify-public-ghcr-arm64, verify-public-ghcr-podman, verify-public-ghcr-podman-delegate, verify-public-windows-data-reuse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/install-dependencies.ts
      - run: bun scripts/release/release-output.ts prepare --github-env
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ env.NEURO_BOOK_RELEASE_DIR }}
      - name: Verify Draft Release identity before activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          test "$(jq -r '.draft' <<<"${release}")" = "true"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r '.target_commitish' <<<"${release}")" = "${{ inputs.revision }}"
      - name: Publish release index last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release/draft-release-assets.ts \
            --repo "${GITHUB_REPOSITORY}" \
            --release-id "${{ inputs.release_id }}" \
            --tag "${{ inputs.tag }}" \
            --file \
              "${NEURO_BOOK_RELEASE_DIR}/release-manifest.json" \
              "${NEURO_BOOK_RELEASE_DIR}/SHA256SUMS"
      - name: Publish verified Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          jq -n --argjson prerelease "${PRERELEASE}" '{draft: false, prerelease: $prerelease}' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null

  activate-container-tags:
    needs: publish-index
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate-assets
      - name: Verify published Release identity before OCI activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          test "$(jq -r '.draft' <<<"${release}")" = "false"
          test "$(jq -r '.prerelease' <<<"${release}")" = "${PRERELEASE}"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r '.target_commitish' <<<"${release}")" = "${{ inputs.revision }}"
      - name: Activate verified OCI digest aliases
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          manifest="candidate-assets/release-manifest.json"
          image_ref="$(jq -r '.ghcr.ref' "${manifest}")"
          image="${image_ref%@*}"
          digest="$(jq -r '.ghcr.digest' "${manifest}")"
          test "${image_ref}" = "${image}@${digest}"
          tags=(--tag "${image}:${RELEASE_TAG}")
          if [[ "${PRERELEASE}" != "true" ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${image}@${digest}"
          activated="sha256:$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --raw | sha256sum | awk '{print $1}')"
          test "${activated}" = "${digest}"
