# CI 只把本地的验证门禁（docs/testing/README.md 的“验证门禁”）在干净机器上再跑一遍，不另立规则：
# 选哪些包由 test:affected 按改动与依赖关系决定，这里不维护路径表。e2e 只在本地跑。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # 发布流水线（release.yml）在标签提交上整套跑一遍。被调用时 github 上下文是调用方的（标签推送的 before 不能当基准），
  # 所以由输入直接要 --all，不靠事件的形状。
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false

permissions:
  contents: read

# 只有 PR 的新一轮取消旧的。推 master 按 github.event.before 选包，取消一轮（包括排队中的）就等于那次推送的改动
# 没人测，所以每次推送各成一组，互不取消。组名带上调用来源（被发布流水线调用时 github.workflow 是 Release），
# 免得与 master 上同一提交的 CI 同组排队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 治理、文档与受影响的包
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # 治理检查核对迁移记录里的提交；选包要找基准与 HEAD 的共同祖先。
          fetch-depth: 0
      # Vitest 与 vue-tsc 的抬头行是 node。
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: 定改动范围
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        # 要求了全部（被发布流水线调用）、基准缺失、是全零（新分支）或与 HEAD 没有共同祖先（强推）时测全部。
        run: |
          if [ "$ALL" = "true" ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && git merge-base "$base" HEAD > /dev/null 2>&1; then
            echo "args=--since $base" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi
      - run: bun run governance:check ${{ steps.scope.outputs.args }}
      - run: bun run docs:check ${{ steps.scope.outputs.args }}
      - run: bun run test:affected ${{ steps.scope.outputs.args }} --typecheck

  app-package:
    name: 应用包、SDK 与 nb-layout 的产物能打出来，nb-layout 的公开面与 API 报告一致
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:app-package
        working-directory: packages/neuro-book
      - run: bun run build:sdk
        working-directory: packages/neuro-book
      # nb-layout 的编译产物与构建完的自查（导出名、纯 TS 入口不拉进 Vue、随包文件）；浏览器冒烟仍只在 release:smoke。
      - run: bun run build:package
        working-directory: packages/nb-layout
      # 公开面与入库的 api/*.api.txt 一致（w00026 t48）；产物上一步已经打好，不再构建。
      - run: bun run api:check --no-build
        working-directory: packages/nb-layout
      - run: bun run smoke:server
        working-directory: packages/neuro-book

  site-image:
    name: 官方站的产物与镜像能打出来，产物过合同测试，镜像能起来并通过就绪检查（不推送）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # 相邻版本那两步要在本地检出基准提交。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:image
        working-directory: packages/nb-site-server
      # 打出来的单文件产物与源码行为一致：同一套合同测试对着产物再跑一遍，抓打包丢掉的东西（没内联的 SQL、动态导入）。
      # 源码那一遍在 check 作业里经 test:affected 的依赖图选中。
      - run: bun test
        working-directory: packages/nb-site-contract-tests
        env:
          NB_SITE_SERVER_COMMAND: '["bun","--no-env-file","${{ github.workspace }}/packages/nb-site-server/dist/image/server.js"]'
      # 相邻版本（site.operations 输出 7、验收 2）：“上一个版本”是基准提交的程序，与 check 作业选包用的基准相同。
      # 被发布流水线调用（inputs.all）、手动触发时没有基准，脚本不写 command，下一步跳过；发布时拿哪个版本比由 t13 定。
      # 脚本把 command 与上一个版本缺哪些接口写进 $GITHUB_OUTPUT，子进程的输出走日志，不混进去。
      - name: 上一个版本的程序（基准提交）
        id: previous
        shell: bash
        working-directory: packages/nb-site-server
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          base=""
          if [ "$ALL" != "true" ]; then
            case "$EVENT" in
              pull_request) base="$PR_BASE" ;;
              push) base="$BEFORE" ;;
            esac
          fi
          bun run build:previous --base "$base" --out "$RUNNER_TEMP/previous" --command-out "$GITHUB_OUTPUT"
      - name: 上一个版本接管本版本迁移过、写过的数据目录
        if: steps.previous.outputs.command != ''
        run: bun test src/adjacent-version.test.ts
        working-directory: packages/nb-site-contract-tests
        env:
          NB_SITE_SERVER_COMMAND: '["bun","--no-env-file","${{ github.workspace }}/packages/nb-site-server/dist/image/server.js"]'
          NB_SITE_PREVIOUS_SERVER_COMMAND: ${{ steps.previous.outputs.command }}
          NB_SITE_PREVIOUS_WITHOUT_INGEST: ${{ steps.previous.outputs.without_ingest }}
          NB_SITE_PREVIOUS_WITHOUT_TELEMETRY_JOBS: ${{ steps.previous.outputs.without_telemetry_jobs }}
      - run: bun run smoke:image
        working-directory: packages/nb-site-server
