<!doctype html>
<html lang="zh-CN" class="nb-ui-scrollbar-thin">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="data:," />
        <title>NeuroBook（e2e 测试外壳）</title>
        <link rel="stylesheet" href="../host-loading.css" />
        <!-- 加载页的明暗提示（src/web/host/appearance-hint.ts 记下）：第一帧前取上一次的明暗与颜色；读不到或不合法时按系统明暗。 -->
        <script>
            (function () {
                try {
                    var hint = JSON.parse(localStorage.getItem("nbook.host-appearance") || "null");
                    if (hint === null || (hint.appearance !== "light" && hint.appearance !== "dark")) return;
                    var color = /^(#[0-9a-f]{3,8}|rgba?\([0-9., /%]+\))$/i;
                    var names = ["background", "text", "muted", "accent"];
                    // 有一项颜色不合格就整条不认：只用一部分会让底色跟系统、文字跟记录，明暗混在一起。
                    if (!names.every(function (name) { return typeof hint[name] === "string" && color.test(hint[name]); })) return;
                    var root = document.documentElement;
                    root.setAttribute("data-host-appearance", hint.appearance);
                    root.style.colorScheme = hint.appearance;
                    names.forEach(function (name) {
                        root.style.setProperty("--host-loading-" + name, hint[name]);
                    });
                    // 场景图与进度样式各自独立：缺一个或不合格，只是这一项退回缺省（颜色是另一回事，混着用会让明暗不一致）。
                    // 地址先按浏览器的 URL 规则解析再判同源（协议相对的 //host/… 解析后是别的主机），路径里不能有引号、括号、反斜杠与空白。
                    if (typeof hint.scene === "string") {
                        try {
                            var scene = new URL(hint.scene, location.href);
                            if (scene.origin === location.origin && !scene.username && !scene.password && !scene.search && !scene.hash && scene.pathname.indexOf("//") !== 0 && /^\/[^"'()\\\s]+$/.test(scene.pathname)) {
                                root.style.setProperty("--host-loading-scene", 'url("' + scene.pathname + '")');
                                root.setAttribute("data-host-scene", "");
                            }
                        } catch (error) {
                            console.warn("[nbook] 读不出加载页的场景图提示", error);
                        }
                    }
                    if (hint.indicator === "dots" || hint.indicator === "pulse" || hint.indicator === "page") root.setAttribute("data-host-indicator", hint.indicator);
                } catch (error) {
                    console.warn("[nbook] 读不出加载页的明暗提示", error);
                }
            })();
        </script>
        <!-- 加载页的界面语言（src/web/host/locale-hint.ts 记下）：第一帧前按上一次的界面语言设 <html lang> 与加载页的读屏名；读不到或不在宿主语言集合里时保持 zh-CN。两种语言的文字与宿主目录 nbook.host 的 loading.label 由 locale-hint.dom.test.ts 核对一致。 -->
        <script>
            (function () {
                try {
                    var labels = { "zh-CN": "正在启动 NeuroBook", "en-US": "Starting NeuroBook" };
                    var tag = localStorage.getItem("nbook.host-locale");
                    if (tag === null || !Object.prototype.hasOwnProperty.call(labels, tag)) return;
                    document.documentElement.lang = tag;
                    // 加载页的 <main> 在这段脚本之后才解析到：文档解析完立即补上（已解析完则立即设）。
                    var label = function () {
                        var page = document.querySelector("[data-browser-host-status]");
                        if (page !== null) page.setAttribute("aria-label", labels[tag]);
                    };
                    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", label);
                    else label();
                } catch (error) {
                    console.warn("[nbook] Cannot read the stored interface language", error);
                }
            })();
        </script>
    </head>
    <body>
        <div id="app">
            <!-- 加载页：书名与提示由前端入口在引导给出书名后写进来（boot.ts），进度条一直在正中。 -->
            <main class="nb-host-loading" data-browser-host-status="loading" role="status" aria-label="正在启动 NeuroBook">
                <p class="nb-host-loading__title" data-host-loading-title></p>
                <div class="nb-host-loading__bar nb-host-indicator"></div>
                <p class="nb-host-loading__hint" data-host-loading-hint></p>
            </main>
        </div>
        <script type="module" src="./e2e-main.ts"></script>
    </body>
</html>
